<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>StormCodeEditor IDE · Settings</title>
  <link rel="stylesheet" href="app-pages.css">
</head>
<body>
  <main class="app-page">
    <header class="page-header">
      <div class="page-icon">&#9881;</div>
      <div>
        <h1>Settings</h1>
        <p>Customize StormCodeEditor</p>
      </div>
    </header>

    <section class="panel">
      <h2>Language</h2>
      <div class="setting-row">
        <div class="setting-label">
          <strong>Language</strong>
          <span>Interface language</span>
        </div>
        <select id="languageSelect" aria-label="Language" disabled>
          <option value="en">English</option>
        </select>
      </div>
    </section>
  </main>

  <script src="app-pages.js"></script>
  <script src="settings.js"></script>
</body>
</html>
