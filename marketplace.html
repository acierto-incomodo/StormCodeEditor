<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>StormCodeEditor IDE · Marketplace</title>
  <link rel="stylesheet" href="app-pages.css">
</head>
<body>
  <main class="app-page">
    <header class="page-header">
      <div class="page-icon">&#9638;</div>
      <div>
        <h1>Marketplace</h1>
        <p>Explore extensions for StormCodeEditor</p>
      </div>
    </header>

    <input id="extensionSearch" class="search-box" type="search" placeholder="Search extensions..." aria-label="Search extensions">

    <section class="extension-grid" id="extensionGrid">
      <article class="extension-card" data-name="python tools">
        <strong>Python Tools</strong>
        <p>Basic tools for working with Python projects.</p>
        <button type="button" disabled>Install</button>
      </article>
      <article class="extension-card" data-name="theme dark pro">
        <strong>Dark Theme Pro</strong>
        <p>A modern dark theme for the editor.</p>
        <button type="button" disabled>Install</button>
      </article>
      <article class="extension-card" data-name="html formatter">
        <strong>HTML Formatter</strong>
        <p>Automatic formatting for HTML documents.</p>
        <button type="button" disabled>Install</button>
      </article>
      <article class="extension-card" data-name="git helpers">
        <strong>Git Helpers</strong>
        <p>Quick actions for common Git operations.</p>
        <button type="button" disabled>Install</button>
      </article>
    </section>
  </main>
  <script src="marketplace.js"></script>
</body>
</html>
