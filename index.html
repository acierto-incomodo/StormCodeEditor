<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https:;
             script-src 'self' https://unpkg.com 'unsafe-eval' 'unsafe-inline';
             style-src 'self' 'unsafe-inline' https:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StormCodeEditor IDE</title>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/xterm/css/xterm.css" />

  <!-- Optional icons (for folder/file icons like VS Code) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <div id="toolbar">
    <div class="app-brand" aria-label="StormCodeEditor">
      <span class="brand-mark">SCE</span>
      <span>StormCodeEditor IDE</span>
    </div>

    <div class="toolbar-group" aria-label="File actions">
      <button id="newBtn" title="New file"><i class="fa-solid fa-plus" aria-hidden="true"></i><span>New</span></button>
      <button id="openBtn" title="Open file"><i class="fa-regular fa-file" aria-hidden="true"></i><span>Open</span></button>
      <button id="openFolderBtn" title="Open folder"><i class="fa-regular fa-folder-open" aria-hidden="true"></i><span>Folder</span></button>
      <button id="saveBtn" title="Save"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save</span></button>
      <button id="saveAsBtn" title="Save as"><i class="fa-solid fa-file-export" aria-hidden="true"></i><span>Save As</span></button>
    </div>

    <span id="filePath" class="muted">(untitled)</span>

    <div class="toolbar-actions">
      <button id="openBrowserBtn" title="Toggle browser"><i class="fa-solid fa-globe" aria-hidden="true"></i></button>
      <button id="terminalToggleToolbar" title="Toggle terminal"><i class="fa-solid fa-terminal" aria-hidden="true"></i></button>
    </div>

    <!--
      <button id="update-preview-button" type="button" aria-pressed="false">
        Preview update
      </button>
    -->

    <div id="update-indicator" class="update-indicator hidden">
      <div id="update-status-icon" class="update-status-icon" role="group" aria-label="Update status"
        aria-describedby="update-tooltip">
        <span class="update-progress-ring" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4" />
          </svg>
        </span>
        <button id="update-restart-button" class="update-restart-button hidden" type="button">
          Restart
        </button>
      </div>
      <div id="update-tooltip" class="update-tooltip" role="status">
        <strong id="update-title"></strong>
        <span id="update-details"></span>
      </div>
    </div>
  </div>

  <div id="layout">
    <div id="top">
      <!-- Sidebar (File Explorer) -->
      <div id="sidebar">
        <div class="sidebar-header">EXPLORER</div>

        <div id="fileTree">
          <!-- Sample structure (will be filled dynamically by your Electron renderer.js) -->
          <div class="tree-node directory open">
            <div class="node-label directory">

            </div>

          </div>
        </div>

      </div>

      <!-- Main editor section -->
      <div id="main">
        <div id="tabs"></div>
        <div id="editor"></div>
      </div>
    </div>

    <!-- Terminal Panel (bottom, VS Code style) -->
    <div id="terminal-panel" class="hidden">
      <div id="terminal-toolbar">
        <button id="terminalToggle">Toggle Terminal</button>
        <!-- <button id="newTerminalBtn">New Terminal</button> -->
        <button id="terminalClearBtn">Clear</button>
        <button id="terminalCopyBtn">Copy</button>
        <form id="terminalForm">
          <input id="terminalInput" placeholder="Run command..." />
          <button id="terminalRunBtn" type="button">Run</button>
        </form>
        <!-- <span id="terminalStatus" class="muted">(no terminal)</span> -->
      </div>
      <div id="terminal-container"></div>
    </div>
  </div>
  <!-- Browser integration -->
  <div id="browser-container" role="dialog" aria-label="Browser">
    <div class="browser-toolbar">
      <span class="browser-title"><i class="fa-solid fa-globe" aria-hidden="true"></i> Browser</span>
      <button id="browserCloseBtn" type="button" title="Close browser" aria-label="Close browser">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <webview id="browser-view" src="https://www.google.com" allowpopups></webview>
  </div>
  <!-- Scripts -->
  <script src="https://unpkg.com/monaco-editor@0.34.1/min/vs/loader.js"></script>
  <script src="https://unpkg.com/xterm/lib/xterm.js"></script>
  <script src="https://unpkg.com/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script src="renderer.js"></script>

  <!-- Explorer Toggle Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".node-label.directory").forEach((dir) => {
        dir.addEventListener("click", () => {
          dir.parentElement.classList.toggle("open");
        });
      });
    });
  </script>
</body>

</html>
