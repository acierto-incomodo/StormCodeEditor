<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https:;
             script-src 'self' https://unpkg.com 'unsafe-eval' 'unsafe-inline';
             style-src 'self' 'unsafe-inline' https:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="editorTitle">StormCodeEditor IDE · Editor</title>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />

  <!-- Optional icons (for folder/file icons like VS Code) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <div id="toolbar">
    <div class="app-brand" aria-label="StormCodeEditor">
      <span class="brand-mark">SCE</span>
      <span data-i18n="appBrand">StormCodeEditor IDE</span>
    </div>

    <div class="toolbar-group" data-i18n-aria-label="fileActions">
      <button id="newBtn" data-i18n-title="newFile"><i class="fa-solid fa-plus" aria-hidden="true"></i><span data-i18n="new">New</span></button>
      <button id="openBtn" data-i18n-title="openFile"><i class="fa-regular fa-file" aria-hidden="true"></i><span data-i18n="open">Open</span></button>
      <button id="openFolderBtn" data-i18n-title="openFolder"><i class="fa-regular fa-folder-open" aria-hidden="true"></i><span data-i18n="folder">Folder</span></button>
      <button id="saveBtn" data-i18n-title="save"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span data-i18n="save">Save</span></button>
      <button id="saveAsBtn" data-i18n-title="saveAs"><i class="fa-solid fa-file-export" aria-hidden="true"></i><span data-i18n="saveAs">Save As</span></button>
    </div>

    <span id="filePath" class="muted">(untitled)</span>

    <div class="toolbar-actions">
      <button id="openBrowserBtn" data-i18n-title="toggleBrowser"><i class="fa-solid fa-globe" aria-hidden="true"></i></button>
      <button id="terminalToggleToolbar" data-i18n-title="toggleTerminal"><i class="fa-solid fa-terminal" aria-hidden="true"></i></button>
      <button id="openMarketplaceBtn" data-i18n-title="marketplace"><i class="fa-solid fa-puzzle-piece" aria-hidden="true"></i></button>
      <button id="openSettingsBtn" data-i18n-title="settingsTitle"><i class="fa-solid fa-gear" aria-hidden="true"></i></button>
      <button id="openInfoBtn" data-i18n-title="about"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></button>
    </div>

    <!--
      <button id="update-preview-button" type="button" aria-pressed="false">
        Preview update
      </button>
    -->

    <div id="update-indicator" class="update-indicator hidden">
      <div id="update-status-icon" class="update-status-icon" role="group" data-i18n-aria-label="updateStatus"
        aria-describedby="update-tooltip">
        <span class="update-progress-ring" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4" />
          </svg>
        </span>
        <button id="update-restart-button" class="update-restart-button hidden" type="button">
          Restart
        </button>
      </div>
      <div id="update-tooltip" class="update-tooltip" role="status">
        <strong id="update-title"></strong>
        <span id="update-details"></span>
      </div>
    </div>
  </div>

  <div id="layout">
    <div id="top">
      <!-- Sidebar (File Explorer) -->
      <div id="sidebar">
        <div class="sidebar-header" data-i18n="explorer">EXPLORER</div>

        <div id="fileTree">
          <!-- Sample structure (will be filled dynamically by your Electron renderer.js) -->
          <div class="tree-node directory open">
            <div class="node-label directory">

            </div>

          </div>
        </div>

      </div>

      <!-- Main editor section -->
      <div id="main">
        <div id="tabs"></div>
        <div id="editor"></div>
      </div>
    </div>

    <!-- Terminal Panel (bottom, VS Code style) -->
    <div id="terminal-panel" class="hidden">
      <div id="terminal-toolbar">
        <button id="terminalToggle" data-i18n="toggleTerminal">Toggle Terminal</button>
        <!-- <button id="newTerminalBtn">New Terminal</button> -->
        <button id="terminalClearBtn" data-i18n="clear">Clear</button>
        <button id="terminalCopyBtn" data-i18n="copy">Copy</button>
        <form id="terminalForm">
          <input id="terminalInput" data-i18n-placeholder="runCommand" />
          <button id="terminalRunBtn" type="submit" data-i18n="run">Run</button>
        </form>
        <!-- <span id="terminalStatus" class="muted">(no terminal)</span> -->
      </div>
      <div id="terminal-container"></div>
    </div>
  </div>
  <!-- Browser integration -->
  <div id="browser-container" role="dialog" data-i18n-aria-label="browser">
    <div class="browser-toolbar">
      <span class="browser-title"><i class="fa-solid fa-globe" aria-hidden="true"></i> <span data-i18n="browser">Browser</span></span>
      <button id="browserCloseBtn" type="button" data-i18n-title="closeBrowser" data-i18n-aria-label="closeBrowser">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <webview id="browser-view" src="https://www.google.com" allowpopups></webview>
  </div>
  <!-- Scripts -->
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="https://unpkg.com/monaco-editor@0.34.1/min/vs/loader.js"></script>
  <script src="app-pages.js"></script>
  <script src="renderer.js"></script>

  <!-- Explorer Toggle Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".node-label.directory").forEach((dir) => {
        dir.addEventListener("click", () => {
          dir.parentElement.classList.toggle("open");
        });
      });
    });
  </script>
</body>

</html>
