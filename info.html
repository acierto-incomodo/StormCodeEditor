<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title data-i18n="informationTitle">StormCodeEditor IDE · Information</title>
  <link rel="stylesheet" href="app-pages.css">
</head>
<body>
  <main class="app-page">
    <header class="page-header">
      <div class="page-icon">i</div>
      <div>
        <h1>StormCodeEditor</h1>
        <p data-i18n="applicationInformation">Application information</p>
      </div>
    </header>

    <section class="panel">
      <h2 data-i18n="details">Details</h2>
      <div class="info-row"><strong data-i18n="version">Version</strong><span id="appVersion">-</span></div>
      <div class="info-row"><strong data-i18n="developer">Developer</strong><span>StormGamesStudios</span></div>
      <div class="info-row"><strong data-i18n="application">Application</strong><span id="appName">StormCodeEditor IDE</span></div>
    </section>

    <section class="panel">
      <h2 data-i18n="technologiesUsed">Technologies used</h2>
      <div class="tech-grid">
        <article class="tech-card"><strong>Electron</strong><span data-i18n="desktopFramework">Desktop framework</span></article>
        <article class="tech-card"><strong>Monaco Editor</strong><span data-i18n="codeEditor">Code editor</span></article>
        <article class="tech-card"><strong>xterm.js</strong><span data-i18n="integratedTerminal">Integrated terminal</span></article>
        <article class="tech-card"><strong>Node.js</strong><span data-i18n="processesFileSystem">Processes and file system</span></article>
      </div>
    </section>
  </main>
  <script src="app-pages.js"></script>
  <script src="info.js"></script>
</body>
</html>
